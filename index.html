        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; }

    <!DOCTYPE html>
<html lang="es">

<div class="container">

    <section class="card">

        <label>Días hábiles</label>
        <input type="number" id="diasHabiles2">

        <div class="button-group">
            <button class="btn-main" onclick="calcularNuevaProrroga()">Calcular</button>
            <button class="btn-sec" onclick="copiarNuevaProrroga()">Copiar Resultado</button>

            <p><strong>Vencimiento:</strong> <span id="vencimiento2"></span></p>

    </section>

    <section class="card">
        <h2>Control de Detención</h2>

        <label>Fecha y hora de inicio</label>
        <input type="datetime-local" id="fechaHora">

        <label>Horas</label>
        <input type="number" id="horas" value="72">

        <div class="button-group">
            <button class="btn-main" onclick="calcularDetencion()">Calcular</button>
            <button class="btn-sec" onclick="copiarDetencion()">Copiar Resultado</button>
        </div>

        <div class="resultado">
            <p><strong>Vencimiento:</strong> <span id="vencimientoDetencion"></span></p>
        </div>
    </section>

    <section class="card" id="cardDetalle" style="display: none; border-left: 5px solid #0072CE;">
        <div style="display: flex; justify-content: space-between; align-items: center;">

                    </ul>
            </div>
        </details>
    </section>
</div>

<script src="app.js"></script>

<script>
// ======================
// FERIADOS
// ======================

const feriadosBase = [
    "2026-01-01", "2026-01-02", "2026-01-03", "2026-01-04", "2026-01-05", "2026-01-06",

    "2027-01-04", "2027-01-05", "2027-01-06", "2027-01-07", "2027-01-08", "2027-01-09", "2027-01-10", "2027-01-11", "2027-01-12",
    "2027-01-13", "2027-01-14", "2027-01-15", "2027-01-16", "2027-01-17", "2027-01-18",
    "2027-01-19", "2027-01-20", "2027-01-21", "2027-01-22", "2027-01-23", "2027-01-24",
    "2027-01-25", "2027-01-26", "2027-01-27", "2027-01-28", "2027-01-29", "2027-01-30",
    "2027-01-31"
];

let feriados = JSON.parse(localStorage.getItem("feriados")) || [...feriadosBase];

// ======================
// FUNCIONES GENERALES
// ======================

function formatearFecha(fecha) {
    return fecha.toLocaleDateString("es-AR");
}

function formatearFechaHora(fecha) {
    return fecha.toLocaleString("es-AR");
}

function esFeriado(fecha) {
    const anio = fecha.getFullYear();
    const mes = String(fecha.getMonth() + 1).padStart(2, '0');
    const dia = String(fecha.getDate()).padStart(2, '0');
    const texto = `${anio}-${mes}-${dia}`;
    return feriados.includes(texto);
}

function esHabil(fecha) {
    const dia = fecha.getDay();
    if (dia === 0 || dia === 6) return false;
    if (esFeriado(fecha)) return false;
    return true;
}

function sumarDiasHabiles(fechaInicio, cantidadDias) {
    let fecha = new Date(fechaInicio);
    let contados = 0;

    while (contados < cantidadDias) {
        if (esHabil(fecha)) {
            contados++;
        }
        if (contados < cantidadDias) {
            fecha.setDate(fecha.getDate() + 1);
        }
    }
    return fecha;
}

// ======================
// PRIMERA PRÓRROGA
// ======================

function calcularPrimeraProrroga() {
    const fechaTexto = document.getElementById("fechaInicio").value;
    const dias = parseInt(document.getElementById("diasHabiles1").value);

    if (!fechaTexto || !dias) {
        alert("Complete todos los campos");
        return;
    }

    const [anio, mes, dia] = fechaTexto.split("-");
    const fechaRealAudiencia = new Date(anio, mes - 1, dia);
    const inicioComputo = new Date(fechaRealAudiencia);

    const vencimiento = sumarDiasHabiles(inicioComputo, dias);
    const diasCorridos = Math.round((vencimiento - fechaRealAudiencia) / (1000 * 60 * 60 * 24)) + 1;

    document.getElementById("vencimiento1").innerText = formatearFecha(vencimiento);
    document.getElementById("corridos1").innerText = diasCorridos;
}

// ======================
// NUEVA PRÓRROGA
// ======================

function calcularNuevaProrroga() {
    const fechaTexto = document.getElementById("fechaVencimientoAnterior").value;
    const dias = parseInt(document.getElementById("diasHabiles2").value);

    if (!fechaTexto || !dias) {
        alert("Complete todos los campos");
        return;
    }

    const [anio, mes, dia] = fechaTexto.split("-");
    const fechaVencimientoAnt = new Date(anio, mes - 1, dia);

    const inicioComputo = new Date(fechaVencimientoAnt);
    inicioComputo.setDate(inicioComputo.getDate() + 1);

    const vencimiento = sumarDiasHabiles(inicioComputo, dias);
    const diasCorridos = Math.round((vencimiento - fechaVencimientoAnt) / (1000 * 60 * 60 * 24));

    document.getElementById("vencimiento2").innerText = formatearFecha(vencimiento);
    document.getElementById("corridos2").innerText = diasCorridos;
}

// ======================
// DETENCIÓN
// ======================

function calcularDetencion() {
    const fechaHora = document.getElementById("fechaHora").value;
    const horas = parseInt(document.getElementById("horas").value);

    if (!fechaHora || !horas) {
        alert("Complete todos los campos");
        return;
    }

    const inicio = new Date(fechaHora);
    const vencimiento = new Date(inicio.getTime() + horas * 60 * 60 * 1000);

    document.getElementById("vencimientoDetencion").innerText = formatearFechaHora(vencimiento);
}

// ======================
// MANEJO DE FERIADOS
// ======================

function guardarFeriados() {
    localStorage.setItem("feriados", JSON.stringify(feriados));
}

function mostrarFeriados() {
    const lista = document.getElementById("listaFeriados");
    lista.innerHTML = "";

    feriados.sort().forEach((fecha, indice) => {
        const li = document.createElement("li");
        li.style.marginBottom = "5px";
        li.innerHTML = `📅 ${fecha} <button onclick="eliminarFeriado(${indice})" style="margin-left: 10px; padding: 2px 8px; font-size: 12px; background: #e74c3c; color: white; border: none; border-radius: 3px; cursor: pointer;">Eliminar</button>`;
        lista.appendChild(li);
    });
}

function agregarFeriado() {
    const fecha = document.getElementById("nuevoFeriado").value;
    if (!fecha) return;

    if (!feriados.includes(fecha)) {
        feriados.push(fecha);
        guardarFeriados();
        mostrarFeriados();
    }
    document.getElementById("nuevoFeriado").value = "";
}

function eliminarFeriado(indice) {
    feriados.splice(indice, 1);
    guardarFeriados();
    mostrarFeriados();
}

function restablecerFeriados() {
    if(confirm("¿Seguro que querés restablecer los feriados de origen?")) {
        feriados = [...feriadosBase];
        guardarFeriados();
        mostrarFeriados();
    }
}

window.onload = function() {
    mostrarFeriados();
};

// COPIAR RESULTADOS

function copiarPrimeraProrroga() {
    const fecha = document.getElementById("fechaInicio").value;
    const dias = document.getElementById("diasHabiles1").value;
    const vencimiento = document.getElementById("vencimiento1").innerText;
    const corridos = document.getElementById("corridos1").innerText;

    if(!vencimiento) { alert("Primero debés calcular el resultado"); return; }

    const texto = `PRIMERA PRÓRROGA\n\nFecha de audiencia: ${fecha}\nDías hábiles: ${dias}\nVencimiento: ${vencimiento}\nDías corridos: ${corridos}`;
    navigator.clipboard.writeText(texto);
    alert("Resultado copiado al portapapeles");
}

function copiarDetencion() {
    const inicio = document.getElementById("fechaHora").value;
    const vencimiento = document.getElementById("vencimientoDetencion").innerText;
    const horas = document.getElementById("horas").value;

    if(!vencimiento) { alert("Primero debés calcular el resultado"); return; }

    const texto = `CONTROL DE DETENCIÓN\n\nInicio: ${inicio}\nHoras: ${horas}\nVencimiento: ${vencimiento}`;

// ======================
// DETALLE DEL CÓMPUTO INTERACTIVO
// ======================

function cargarTablaDetalle(fechaInicio, diasHabiles) {
    const tbody = document.querySelector("#tablaDetalle tbody");
    tbody.innerHTML = "";

    let fecha = new Date(fechaInicio);
    let contador = 0;

    while (contador < diasHabiles) {
        if (esHabil(fecha)) {
            contador++;
            const fila = document.createElement("tr");
            fila.innerHTML = `<td><strong>${contador}º día hábil</strong></td><td>${formatearFecha(fecha)}</td>`;
            tbody.appendChild(fila);
        }
        if (contador < diasHabiles) {
            fecha.setDate(fecha.getDate() + 1);
        }
    }
}

function mostrarDetallePrimera() {
    const fechaTexto = document.getElementById("fechaInicio").value;
    const dias = parseInt(document.getElementById("diasHabiles1").value);

    if (!fechaTexto || !dias) {
        alert("Primero calculá la Primera Prórroga");
        return;
    }

    const [anio, mes, dia] = fechaTexto.split("-");
    const inicioComputo = new Date(anio, mes - 1, dia);

    document.getElementById("tituloDetalle").innerText = "Detalle de Días: Primera Prórroga";
    cargarTablaDetalle(inicioComputo, dias);
    
    // Mostramos la tarjeta del detalle y movemos la pantalla de forma suave hacia ella
    const card = document.getElementById("cardDetalle");
    card.style.display = "block";
    card.scrollIntoView({ behavior: 'smooth' });
}

function mostrarDetalleNueva() {
    const fechaTexto = document.getElementById("fechaVencimientoAnterior").value;
    const dias = parseInt(document.getElementById("diasHabiles2").value);

    if (!fechaTexto || !dias) {
        alert("Primero calculá la Nueva Prórroga");
        return;
    }

    const [anio, mes, dia] = fechaTexto.split("-");
    const inicioComputo = new Date(anio, mes - 1, dia);
    inicioComputo.setDate(inicioComputo.getDate() + 1);

    document.getElementById("tituloDetalle").innerText = "Detalle de Días: Nueva Prórroga";
    cargarTablaDetalle(inicioComputo, dias);
    
    // Mostramos la tarjeta del detalle y movemos la pantalla de forma suave hacia ella
    const card = document.getElementById("cardDetalle");
    card.style.display = "block";
    card.scrollIntoView({ behavior: 'smooth' });
}

function cerrarDetalle() {
    document.getElementById("cardDetalle").style.display = "none";
}
